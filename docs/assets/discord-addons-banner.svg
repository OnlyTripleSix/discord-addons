<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Discord Add-ons by TripleSix</title>
  <desc id="desc">Client-specific Discord plugins and themes for mobile, with desktop support planned.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111418"/>
      <stop offset="1" stop-color="#181B21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#83D1B8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="60" r="150" fill="#5865F2" opacity=".12" filter="url(#soft)"/>
  <circle cx="120" cy="260" r="135" fill="#83D1B8" opacity=".10" filter="url(#soft)"/>

  <g opacity=".20" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M960 55l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M1018 116l34-20 34 20v40l-34 20-34-20z"/>
    <path d="M1076 55l34-20 34 20v40l-34 20-34-20z"/>
  </g>

  <rect x="74" y="62" width="9" height="176" rx="4.5" fill="url(#accent)"/>

  <text x="115" y="126" fill="#F7F8FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
    Discord Add-ons
  </text>
  <text x="118" y="171" fill="#B8BDC7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500">
    Client-specific plugins and themes by TripleSix
  </text>
  <text x="118" y="212" fill="#83D1B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing=".6">
    MOBILE NOW  •  DESKTOP NEXT
  </text>
</svg>
