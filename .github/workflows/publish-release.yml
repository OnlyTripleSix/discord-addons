name: Publish client packages

on:
  push:
    branches: [main]
    paths:
      - '.release/**'
      - 'tools/publish_release.py'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-package-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify package checksums
        run: python3 tools/publish_release.py --check
      - name: Publish BetterDiscord and Valenced packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py
